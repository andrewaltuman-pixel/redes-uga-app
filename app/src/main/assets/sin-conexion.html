  background: radial-gradient(circle at 20% 10%, #12301f 0, transparent 45%), #050907; }
.caja { width: 100%; max-width: 420px; padding: 28px; border: 1px solid #1d3a29; border-radius: 14px; background: #0c1a12; }
svg { width: 40px; height: 40px; color: var(--verde); }
h1 { font-size: 1.15rem; margin: 14px 0 6px; }
p { color: var(--suave); margin: 0 0 20px; line-height: 1.45; }
a { display: inline-block; font-weight: 600; padding: 11px 20px; border-radius: 8px; background: var(--verde); color: #04140b; text-decoration: none; }
</style>
</head>
