plugins {
    id 'com.android.application'
}

// App nativa con visor web propio: abre la plataforma sin depender del navegador instalado.
// No hay que actualizarla cuando cambia la web.
def sitio = 'redes-uga.pages.dev'

android {
    namespace 'dev.pages.redesuga.app'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.pages.redesuga.app'
        minSdk 23
        targetSdk 36
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "2.${versionCode}"

        buildConfigField 'String', 'SITIO', "\"${sitio}\""
        resValue 'string', 'hostName', sitio
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file('firma.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'redes-uga'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig file('firma.jks').exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.work:work-runtime:2.10.1'
}
