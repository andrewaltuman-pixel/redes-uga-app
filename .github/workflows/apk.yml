name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/firma.jks

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk redes-uga.apk

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: redes-uga.apk

  # Un Android viejo (10) y el más nuevo (16): si abre en los dos, abre en los del medio
  probar:
    needs: compilar
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: apk

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar en un emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash prueba-emulador.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prueba-android-${{ matrix.api }}
          path: |
            logcat.txt
            pantalla*.png
            ui*.xml

  publicar:
    needs: probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: apk

      - name: Publicar la APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v2.${{ github.run_number }}" redes-uga.apk \
            --repo "${{ github.repository }}" \
            --title "Redes UGA 2.${{ github.run_number }}" \
            --notes "App Android de https://redes-uga.pages.dev, con visor propio: funciona sin depender del navegador del celular. Descargá redes-uga.apk e instalala." \
            --latest
